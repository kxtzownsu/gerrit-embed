<!--
NOTE:
Comments in this file will automatically get removed at runtime before
sending the final HTML to the client.
-->

<head>
  <title>{{ change.commit.subject }}</title>

  <meta name="description" content="{{ change.commit.message }}">
  <meta name="theme-color" content="{{ color }}">

  <meta http-equiv="refresh" content="3; url={{ change.url }}">

  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ change.commit.subject }}">
  <meta property="og:description" content="{{ change.commit.message }}">
  <meta property="og:url" content="{{ change.url }}">
  <meta property="og:site_name" content="{{ base_url.meta.description }}">

  <meta property="og:image" content="{{ base_url.meta.icon }}">
  <meta property="og:image:alt" content="{{ base_url.meta.description }}">

  <meta property="og:image:type" content="image/x-icon">
  <meta property="og:image:width" content="96">
  <meta property="og:image:height" content="96">

  <meta property="article:author" content="{{ change.author.name }}">
  <meta property="article:published_time" content="{{ change.created }}">
  <meta property="article:modified_time" content="{{ change.updated }}">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ change.commit.subject }}">
  <meta name="twitter:description" content="{{ change.commit.message }}">
  <meta name="twitter:image" content="{{ base_url.meta.icon }}">
  <meta name="twitter:image:alt" content="{{ base_url.meta.description }}">

  <meta name="author" content="{{ change.author.name }}">

  <meta name="msapplication-TileImage" content="{{ base_url.meta.icon }}">
  <meta name="msapplication-TileColor" content="{{ color }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "name": "{{ change.commit.subject }}",
    "description": "{{ change.commit.message }}",
    "url": "{{ change.url }}",
    "image": "{{ base_url.meta.icon }}",
    "datePublished": "{{ change.created }}",
    "dateModified": "{{ change.updated }}",
    "author": {
      "@type": "Person",
      "name": "{{ change.author.name }}",
      "image": "{{ change.author.icon }}"
    },
    "publisher": {
      "@type": "Organization",
      "name": "{{ base_url.meta.description }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ base_url.meta.icon }}"
      }
    }
  }
  </script>
</head>

<body>
  {{ redirect.text }}
</body>

<style>
  body {
    background-color: #1e1e2e;
    color: #cdd6f4;
  }

  a {
    color: #89b4fa;
  }

  a:visited {
    color: #cba6f7;
  }
</style>
